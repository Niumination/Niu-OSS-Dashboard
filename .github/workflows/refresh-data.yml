name: Segarkan snapshot data

# Pola GitOps ala Upptime: snapshot cadangan (lib/mock-data.ts + data/*.json)
# diregenerasi otomatis dari GitHub API tiap minggu, sehingga fallback
# tidak pernah basi — situs tetap utuh saat rate-limit kena.

on:
  schedule:
    - cron: '0 3 * * 1' # Senin 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerasi snapshot mingguan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Jalankan generator (mode fresh)
        run: node scripts/gen-mock.mjs --fresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerasi API publik v1
        run: node scripts/gen-api.mjs

      - name: Commit & push bila ada perubahan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data lib/mock-data.ts public/api/v1
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore(data): snapshot mingguan otomatis [skip ci]"
            git push
          fi
