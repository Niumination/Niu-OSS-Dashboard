name: Lighthouse CI

# Audit performa & aksesibilitas terhadap build statis.
# Budget: lighthouserc.json (performance >= 0.75, a11y/bp/seo >= 0.9, CLS < 0.15).
# Jalankan manual, atau sekali seminggu agar tidak menghalangi iterasi harian.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # Senin 05:00 UTC, setelah refresh data

jobs:
  lighthouse:
    name: Audit Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build statis
        run: npm run export:static
        env:
          SITE_URL: https://niumination.github.io

      - name: Jalankan Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
